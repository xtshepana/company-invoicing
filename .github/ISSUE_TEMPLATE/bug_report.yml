name: Bug report
description: Something isn't working as expected.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: false
  - type: dropdown
    id: role
    attributes:
      label: Role you were signed in as
      options:
        - owner_admin
        - accountant
        - staff
        - Not signed in
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Error messages, screenshots, which browser, etc.
    validations:
      required: false
